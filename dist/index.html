<style>
/* Layout idea: navy header with the club's four-colour stripe, pill tabs, one calm column of cards; tonal steps of the club blue mark hierarchy. */
:root{

}

:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131B2E; --surface-2:#1A2540; --ink:#E8EDF7; --ink-2:#A7B3C9; --line:#2A3758;

*{box-sizing:border-box}

.brand-name{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1}
.brand-sub{font-size:12.5px;opacity:.82}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stripe{display:flex;height:4px}.stripe i{flex:1}.stripe i:nth-child(1){background:var(--sky)}.stripe i:nth-child(2){background:var(--gold)}.stripe i:nth-child(3){background:var(--wine)}.stripe i:nth-child(4){background:var(--green)}

.view{max-width:1040px;margin:0 auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:13.5px} .mono{font-variant-numeric:tabular-nums}

.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--font-display);font-size:32px;line-height:1;color:var(--head);font-variant-numeric:tabular-nums}

.btn-big{padding:16px 20px;font-size:18px;flex:1 1 220px}

.scroll-x{overflow-x:auto}
.was{color:var(--ink-2);text-decoration:line-through}
.list{display:flex;flex-direction:column}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}

.guide{max-width:68ch;display:flex;flex-direction:column;gap:10px}

.toast.on{display:block}
.zoom{position:fixed;inset:0;background:rgba(6,12,26,.94);z-index:30;display:flex;flex-direction:column}
.zoom[hidden]{display:none}
.zoom-close{align-self:flex-end;margin:10px;color:#fff !important;border-color:rgba(255,255,255,.5) !important}

.zoom-scroll img{width:200%;max-width:none;display:block}
@media (min-width:900px){.zoom-scroll img{width:120%}}

@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

</style>

    (o.balance ? wrapBalanced : wrap)(str, width, font, size).forEach((line) => {
      this.text(line, ax, y, o);
      y += leading;
    });
    return y;
  };

  // Straight line between two points.
  Doc.prototype.line = function (x1, y1, x2, y2, lw, color) {
    this.ops.push(colorOp(color, true) + ' ' + num(lw || 0.5) + ' w ' + num(x1) + ' ' + num(PH - y1) + ' m ' +
      num(x2) + ' ' + num(PH - y2) + ' l S');
  };

  // Horizontal line with configurable width.
  Doc.prototype.hline = function (x1, x2, y, lw, color) { this.line(x1, y, x2, y, lw, color); };

  // Filled rectangle; (x, y) is its top-left corner.
  Doc.prototype.fillRect = function (x, y, w, h, color) {
    this.ops.push(colorOp(color) + ' ' + num(x) + ' ' + num(PH - y - h) + ' ' + num(w) + ' ' + num(h) + ' re f');
  };

  // Stroked rectangle; optionally filled first when `fill` is given.
  Doc.prototype.strokeRect = function (x, y, w, h, lw, color, fill) {
    this.ops.push((fill != null ? colorOp(fill) + ' ' : '') + colorOp(color, true) + ' ' + num(lw || 0.8) + ' w ' +
      num(x) + ' ' + num(PH - y - h) + ' ' + num(w) + ' ' + num(h) + ' re ' + (fill != null ? 'B' : 'S'));
  };

  // Check box followed by its label. `x` is the left edge of the box and `y` the
  // label baseline; the box is centred on the cap height of the label.
  // o: { size (label size), box (side), font }. Returns the x after the label.
  Doc.prototype.check = function (label, x, y, ticked, o) {
    o = o || {};
    const size = o.size || LBL, side = o.box || BOX;
    const top = y - size * 0.359 - side / 2;        // 0.718 em = Helvetica cap height
    this.strokeRect(x, top, side, side, 0.8);
    if (ticked) {                                    // "X" mark
      const i = side * 0.2;
      this.line(x + i, top + i, x + side - i, top + side - i, 1.2);
      this.line(x + i, top + side - i, x + side - i, top + i, 1.2);
    }
    x += side + 3.2;
    return label ? this.text(label, x, y, { size: size, font: o.font }) : x;
  };

  // Fill-in line: label at (x, y), then a thin rule up to xEnd. When `value` is
  // given it is printed in Helvetica 10 just above the rule, cut to fit.
  // Returns xEnd.
  Doc.prototype.field = function (label, x, y, xEnd, value, o) {
    const lx = label ? this.text(label, x, y, o) + 3 : x;
    this.blank(lx, y, xEnd, value);
    return xEnd;
  };

  // The rule (and optional value) part of a fill-in line, from x to xEnd.
  // The value starts at the left end of the rule, or is centred on it.
  Doc.prototype.blank = function (x, y, xEnd, value, centred) {
    this.hline(x, xEnd, y + 2.2, 0.5);
    const v = fit(value == null ? '' : value, 'F1', 10, xEnd - x - 4);
    if (!v) return;
    if (centred) this.text(v, (x + xEnd) / 2, y - 0.4, { size: 10, align: 'center' });
    else this.text(v, x + 2, y - 0.4, { size: 10 });
  };

  // Inline flow of words and fill-in blanks, wrapped inside [x, x + width].
  // parts: strings, or { blank: defaultWidth, value } objects. A string that does
  // not start with a space sticks to whatever precedes it (e.g. ", legale ...").
  // Returns the baseline y of the line that would follow.
  Doc.prototype.flow = function (parts, x, y, width, o) {
    const size = o.size || LBL, leading = o.leading || size * 1.9;
    const sp = textWidth(' ', 'F1', size), units = [];
    // 1) Unbreakable units: a word, a blank, or a blank with the text glued to it.
    parts.forEach((p) => {
      if (typeof p === 'string') {
        const glued = units.length > 0 && !/^\s/.test(p);
        p.split(/\s+/).filter(Boolean).forEach((word, i) => {
          const it = { s: word, w: textWidth(word, 'F1', size) };
          if (i === 0 && glued) { const u = units[units.length - 1]; u.items.push(it); u.w += it.w; }
          else units.push({ items: [it], w: it.w });
        });
      } else {
        // A prefilled blank is sized on its value; an empty one keeps its default width.
        const w = p.value ? Math.max(48, textWidth(p.value, 'F1', 10) + 18) : p.blank;
        units.push({ items: [{ w: w, value: p.value || '' }], w: w });
      }
    });
    units.forEach((u) => {                           // unit wider than the column: shorten its blank
      const over = u.w - width;
      if (over > 0 && u.items[0].s == null) { u.items[0].w -= over; u.w -= over; }
    });
    // 2) Greedy line breaking.
    const lines = [];
    let line = null;
    units.forEach((u) => {
      if (!line || line.w + sp + u.w > width) { line = { units: [], w: -sp }; lines.push(line); }
      line.units.push(u);
      line.w += sp + u.w;
    });
    // 3) Draw. On every line but the last, the last empty blank grows to fill the
    //    slack, so that hand-written fields are as long as the line allows.
    lines.forEach((ln, li) => {
      const items = [].concat.apply([], ln.units.map((u) => u.items));
      const empty = items.filter((it) => it.s == null && !it.value);
      if (li < lines.length - 1 && empty.length) empty[empty.length - 1].w += Math.max(0, width - ln.w);
      let cx = x;
      ln.units.forEach((u, ui) => {
        if (ui) cx += sp;
        u.items.forEach((it) => {
          if (it.s != null) this.text(it.s, cx, y, { size: size });
          else this.blank(cx + 1, y, cx + it.w - 1, it.value, true);
          cx += it.w;
        });
      });
      y += leading;
    });
    return y;
  };

  // Serialises the page into a complete PDF 1.4 file.
  Doc.prototype.build = function (title) {
    const stream = this.ops.join('\n');
    const objs = [
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] ' +
        '/Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
      '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream',
      '<< /Title (' + pdfStr(title) + ') /Producer (GymPdf) >>'
    ];
    let pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';        // second line marks the file as binary
    const offsets = [];
    objs.forEach((body, i) => {
      offsets.push(pdf.length);                      // 1 char = 1 byte, so length = byte offset
      pdf += (i + 1) + ' 0 obj\n' + body + '\nendobj\n';
    });
    const xref = pdf.length;
    pdf += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    offsets.forEach((off) => { pdf += ('0000000000' + off).slice(-10) + ' 00000 n \n'; });
    pdf += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R /Info 7 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    const out = new Uint8Array(pdf.length);
    for (let i = 0; i < pdf.length; i++) out[i] = pdf.charCodeAt(i) & 255;
    return out;
  };

    y += 41;
    signatures(d, y, 'Firma Genitore / Atleta maggiorenne leggibile', 'Firma Legale Rappresentante ASD Gym Art');

    // --- office-only block
    y += 23;

    let ry = y + 32.5;

    st ? field('Iscrizione', select(ens.map(function (e) { return [e.row, e.corso + (e.fascia ? ' ' + e.fascia : '') + (e.tipo ? ' · ' + e.tipo : '') + (e.active ? '' : ' (annullata o storica)')]; }), p.enrollRow, function (v) { p.enrollRow = Number(v); p.ack = false; render(); })) : null));
  if (st && !ens.length) add(card, note('bad', 'Questa allieva non ha iscrizioni: inserisci prima il suo modulo.'));
  var e = st && p.enrollRow !== null ? P.byRow(db.enrollments, p.enrollRow) : null;
  if (e) {
    add(card, el('div', { class: 'grid' }, tile(C.fmtMoney(e.dovutoN || 0), 'Dovuto', ''), tile(C.fmtMoney(e.pagatoN || 0), 'Pagato', 'ok'), tile(C.fmtMoney(e.residuoN || 0), 'Residuo', e.residuoN > 0 ? 'warn' : 'ok')));
    function pin(key, label, type, hint) { var i = el('input', { type: type, value: p[key], autocomplete: 'off', oninput: function () { p[key] = i.value; refreshPay(); } }); return field(label, i, hint); }
    add(card, el('div', { class: 'fields' }, pin('data', 'Data del pagamento', 'date'), pin('importo', 'Importo (€)', 'text', e.residuoN > 0 ? 'Residuo: ' + C.fmtMoney(e.residuoN) : null),
      field('Metodo', select([['', '— scegli —']].concat(db.lists.metodi), p.metodo, function (v) { p.metodo = v; refreshPay(); })), pin('note', 'Nota (facoltativa)', 'text')));
    add(card, el('div', { id: 'pay-box' }, payBox()));
    var hist = db.payments.filter(function (x) { return parseInt(x.idIscr, 10) === parseInt(e.id, 10); });
    add(card, el('details', null, el('summary', { text: 'Versamenti già registrati per questa iscrizione (' + hist.length + ')' }), hist.length ? el('div', { class: 'scroll-x' }, el('table', null,
      el('thead', null, el('tr', null, el('th', { text: 'Data' }), el('th', { class: 'num', text: 'Importo' }), el('th', { text: 'Metodo' }), el('th', { text: 'Ricevuta' }))),
      el('tbody', null, hist.map(function (x) { return el('tr', null, el('td', { class: 'mono', text: C.isoToIt(x.data) || 'senza data' }), el('td', { class: 'num', text: C.fmtMoney(x.importoN) }), el('td', { text: x.metodo }), el('td', { text: x.ricevuta })); })))) : el('p', { class: 'muted', text: 'Nessuno.' })));
  }
  out.push(card);
  return out;
}
function refreshPay() { var b = $('pay-box'); if (b) { clear(b); add(b, payBox()); } }
function payBox() {
  var p = S.pay, plan = P.planPagamento(S.db, { enrollRow: p.enrollRow, data: p.data, importo: p.importo, metodo: p.metodo, note: p.note }), out = [];
  var typing = !p.importo && !p.metodo;
  if (plan.errors.length && !typing) out.push(note('bad', 'Da correggere:', plan.errors));
  if (plan.warnings.length) out.push(note('warn', 'Avvisi da leggere:', plan.warnings));
  var ack = null;
  if (plan.warnings.length && !plan.errors.length) { var cb = el('input', { type: 'checkbox', checked: p.ack, id: 'pay-ack', onchange: function () { p.ack = cb.checked; refreshPay(); } }); ack = el('label', { class: 'check', for: 'pay-ack' }, cb, el('span', { text: 'Ho letto gli avvisi e voglio registrare lo stesso.' })); }
  var blocked = plan.errors.length || (plan.warnings.length && !p.ack) || !canWrite() || S.busy;
  out.push(ack, el('div', { class: 'row' }, el('button', { class: 'btn btn-primary btn-big', type: 'button', disabled: !!blocked, text: plan.errors.length ? 'Registra il pagamento' : 'Registra ' + C.fmtMoney(plan.payment.importo) + ' · ' + p.metodo, onclick: commitPayment })));
  return out;
}
async function commitPayment() {
  if (S.busy) return;
  var p = S.pay, steps = [], reg = [];
  S.busy = true; render();
  try {
    await loadDb();
    if (!canWrite()) throw { code: 'x', message: 'Il foglio non ha la struttura attesa: non scrivo nulla.' };
    var db = S.db, plan = P.planPagamento(db, { enrollRow: p.enrollRow, data: p.data, importo: p.importo, metodo: p.metodo, note: p.note });
    if (plan.errors.length) throw { code: 'x', message: plan.errors.join(' ') };
    if (!plan.enrollment || C.tokenKey(plan.enrollment.allieva) !== C.tokenKey(p.name)) throw { code: 'x', message: 'Nel frattempo il foglio è cambiato e l\'iscrizione scelta non è più la stessa. Non ho scritto nulla: riscegli l\'allieva.' };
    var r = await savePayment(db, plan.payment, plan.enrollment.row, plan.enrollment.allieva, 'Pagamento', C.toSerial());
    steps.push(r.step); reg = r.reg;
    p.importo = ''; p.note = ''; p.ack = false;
  } catch (e) { steps.push({ ok: false, text: e && (e.code === 'x' || e.code === 'busy_row' || e.code === 'verify') ? e.message : 'Pagamento NON registrato: ' + errText(e) }); }
  await writeRegistro(reg, steps);
  try { await loadDb(); } catch (e2) { /* shown by the connection chip */ }
  p.result = steps; S.busy = false; render();
}
