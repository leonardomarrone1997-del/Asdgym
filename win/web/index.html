<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Art">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="gymart-token" content="__TOKEN__">
<title>Gym Art Segreteria</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="gymart.css">
<script src="tema.js"></script>
</head>
<body>
<div id="offline" class="offline" role="alert" hidden>Il programma è stato chiuso: le modifiche non vengono più salvate. Chiudi questa finestra e riapri Gym Art Segreteria.</div>
<a class="salta" href="#view">Vai al contenuto</a>
<div class="app">
<aside class="side" aria-label="Menu">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div class="brand-testo"><div class="brand-name">Gym Art</div><div class="brand-sub">Segreteria · Avezzano</div></div></div>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
</aside>
<div class="main">
<header class="top">
  <div class="top-in">
    <div class="top-brand"><span class="brand-mark" aria-hidden="true"></span>Gym Art</div>
    <div class="top-stagione">Stagione <b id="stagione"></b></div>
    <div class="top-actions"><span id="conn" class="chip chip-mute">Apertura…</span>
      <button id="det" class="interruttore" type="button" role="switch" aria-checked="false" title="Mostra più dettagli: colonne in più, valori sui grafici, note"><span class="pallino" aria-hidden="true"></span>Dettaglio</button>
      <a class="btn btn-primary btn-ghost" href="#allieva/nuova">Nuova allieva</a>
      <button id="esci" class="btn btn-small" type="button" hidden title="Esci da questo dispositivo">Esci</button></div>
  </div>
</header>
<main id="view" class="view" tabindex="-1"></main>
</div>
</div>
<nav id="bottom" class="bottom" aria-label="Sezioni"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<script src="core.js"></script>
<script src="pdf.js"></script>
<script src="xlsx.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
