  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  <div class="side-fondo"><button id="chiudi" class="side-chiudi" type="button" title="Salva e chiudi il programma"><span class="side-chiudi-testo">Chiudi il programma</span></button></div>

<div class="main">
<header class="top">
  <div class="top-in">
    <div class="top-brand"><span class="brand-mark" aria-hidden="true"></span>Gym Art</div>
    <nav class="naviga" aria-label="Navigazione">
      <button id="indietro" class="nav-btn" type="button" aria-label="Indietro" title="Indietro: la pagina di prima" disabled></button>
      <a id="home" class="nav-btn nav-home" href="#inizio" title="Home"><span>Home</span></a>
      <ol id="percorso" class="percorso" aria-label="Dove sei"></ol>
    </nav>
    <div class="top-actions"><button id="agg" class="chip chip-info agg-chip" type="button" hidden title="C'è una versione nuova del programma">Aggiornamento disponibile</button>

      <a id="aiuto" class="aiuto" href="#guida" aria-label="Aiuto: manuale e visita guidata" title="Aiuto: manuale e visita guidata">?</a>
      <button id="paga" class="btn" type="button" title="Registra un pagamento (Alt + P)">Registra pagamento</button>
      <a id="nuova" class="btn btn-primary" href="#iscrizione/nuova" title="Nuova iscrizione (Alt + N)">Nuova iscrizione</a>
      <button id="esci" class="btn btn-small" type="button" hidden title="Esci da questo dispositivo">Esci</button></div>
  </div>
</header>
<main id="view" class="view" tabindex="-1"></main>
